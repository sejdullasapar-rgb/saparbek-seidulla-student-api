server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${APP_CONTEXT_PATH:/saparbek-seidulla}

spring:
  application:
    name: saparbek-seidulla-student-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  student-name: ${STUDENT_NAME:Saparbek Seidulla}
